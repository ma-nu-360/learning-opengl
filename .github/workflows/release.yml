name: Release
on:
  push:
    tags:
    - '*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          libglfw3-dev \
          libgl1-mesa-dev

    - name: Make build script executable
      run: chmod +x scripts/build.sh
    
    - name: Build
      run: ./scripts/build.sh
    
    - name: Create tar archive
      run: |
        mkdir release
        tar -czf release/MyOpenGLApp.tar.gz -C build/MyOpenGLApp
    
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: release/MyOpenGLApp.tar.gz